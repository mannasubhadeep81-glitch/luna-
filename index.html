<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA 3D Racing</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="hud">
  <h2>LUNA 3D RACING</h2>
  <div>Speed: <span id="speed">0</span> KM/H</div>
  <div>Score: <span id="score">0</span></div>
  <div>Nitro: <span id="nitro">100</span>%</div>
</div>

<div id="startScreen">
  <h1>LUNA RACING</h1>
  <p>3D Supercar Racing</p>
  <button onclick="startGame()">START RACE</button>
</div>

<div id="controls">
  <button onpointerdown="left=true" onpointerup="left=false">◀</button>
  <button onpointerdown="brake=true" onpointerup="brake=false">▼</button>
  <button onpointerdown="right=true" onpointerup="right=false">▶</button>
  <button onpointerdown="boost=true" onpointerup="boost=false">NITRO</button>
</div>

<script type="module" src="game.js"></script>

</body>
